<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinetic Strings & Drums</title>
  <style>
    :root {
      --bg: #0d0f14;
      --panel: #141821;
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #38bdf8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .hud {
      position: fixed;
      top: 18px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hint {
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: rgba(20, 24, 33, 0.75);
      padding: 8px 14px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .controls {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    button {
      background: rgba(20, 24, 33, 0.85);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.15s ease;
      backdrop-filter: blur(6px);
    }
    button:hover {
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="hint">Drag across strings or shapes • Double-click empty space to launch kinetic orbs</div>
    <div class="controls">
      <button id="addOrbBtn">+ Orb</button>
      <button id="clearOrbsBtn">Clear Orbs</button>
      <button id="clearScoreBtn">Clear Staff</button>
    </div>
  </div>

  <canvas id="app"></canvas>

  <script>
    const canvas = document.getElementById('app');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    let staffTop = height * 0.72;

    // --- WEB AUDIO SYNTHESIS ENGINE ---
    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Karplus-Strong Plucked String Synthesis
    function playGuitarNote(freq) {
      ensureAudio();
      const sampleRate = audioCtx.sampleRate;
      const duration = 2.2;
      const length = Math.floor(sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, length, sampleRate);
      const data = buffer.getChannelData(0);
      const period = Math.max(2, Math.round(sampleRate / freq));

      // Initialize delay line with warm filtered noise burst
      for (let i = 0; i < period; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (period * 0.7));
      }

      // Feedback loop with low-pass averaging
      const damping = 0.994;
      for (let i = period; i < length; i++) {
        data[i] = (data[i - period] + data[i - period + 1]) * 0.5 * damping;
      }

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.45, audioCtx.currentTime);

      source.connect(gain);
      gain.connect(audioCtx.destination);
      source.start();
    }

    // Synthesized Drum Transients
    function playDrum(type) {
      ensureAudio();
      const now = audioCtx.currentTime;

      if (type === 'kick') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(135, now);
        osc.frequency.exponentialRampToValueAtTime(36, now + 0.14);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.36);
      } else if (type === 'snare') {
        // Noise burst
        const bufSize = audioCtx.sampleRate * 0.2;
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const out = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) out[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buf;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(350, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);

        // Body snap
        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(95, now + 0.08);
        oscGain.gain.setValueAtTime(0.4, now);
        oscGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'hihat') {
        const bufSize = audioCtx.sampleRate * 0.09;
        const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const out = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) out[i] = (Math.random() * 2 - 1);
        const noise = audioCtx.createBufferSource();
        noise.buffer = buf;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(7500, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
      } else if (type === 'tom') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(88, now + 0.22);
        gain.gain.setValueAtTime(0.55, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.27);
      }
    }

    // --- MUSICAL ELEMENTS: STRINGS, DRUM SHAPES & SHEET MUSIC ---
    // Standard Guitar Open Strings mapped to Treble Staff steps
    // Staff lines from bottom to top: Line 0 = E4, Line 1 = G4, Line 2 = B4, Line 3 = D5, Line 4 = F5
    // Step index: 0 = E4, -1 = D4, -2 = C4, -3 = B3, -4 = A3, -5 = G3, -6 = F3, -7 = E3, -8 = D3
    const guitarStrings = [
      { name: 'E4', freq: 329.63, step: 0,  color: '#38bdf8', amp: 0, vel: 0 },
      { name: 'B3', freq: 246.94, step: -3, color: '#60a5fa', amp: 0, vel: 0 },
      { name: 'G3', freq: 196.00, step: -5, color: '#818cf8', amp: 0, vel: 0 },
      { name: 'D3', freq: 146.83, step: -8, color: '#a78bfa', amp: 0, vel: 0 },
      { name: 'A2', freq: 110.00, step: -11, color: '#c084fc', amp: 0, vel: 0 },
      { name: 'E2', freq: 82.41,  step: -14, color: '#e879f9', amp: 0, vel: 0 }
    ];

    const drumShapes = [
      { id: 'kick',  label: 'Kick',   shape: 'circle',   step: -6, color: '#f43f5e', pulse: 0, x: 0, y: 0, r: 44 },
      { id: 'snare', label: 'Snare',  shape: 'square',   step: -1, color: '#f59e0b', pulse: 0, x: 0, y: 0, r: 40 },
      { id: 'tom',   label: 'Hi-Tom', shape: 'hexagon',  step: 2,  color: '#10b981', pulse: 0, x: 0, y: 0, r: 38 },
      { id: 'hihat', label: 'Hi-Hat', shape: 'triangle', step: 5,  color: '#06b6d4', pulse: 0, x: 0, y: 0, r: 36 }
    ];

    const sheetNotes = []; // Recorded notes on the bottom staff
    const orbs = [];

    function layoutElements() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      staffTop = height * 0.72;

      const playAreaHeight = staffTop - 80;
      const startY = 85;
      const spacing = playAreaHeight / (guitarStrings.length);

      guitarStrings.forEach((s, idx) => {
        s.x1 = width * 0.06;
        s.x2 = width * 0.54;
        s.y = startY + spacing * (idx + 0.45);
      });

      // Position drum shapes on the right side
      const cx = width * 0.77;
      const cy = startY + playAreaHeight * 0.46;
      const spreadX = Math.min(130, width * 0.1);
      const spreadY = Math.min(95, playAreaHeight * 0.25);

      drumShapes[0].x = cx - spreadX * 0.65;
      drumShapes[0].y = cy + spreadY * 0.65;

      drumShapes[1].x = cx + spreadX * 0.65;
      drumShapes[1].y = cy + spreadY * 0.45;

      drumShapes[2].x = cx - spreadX * 0.55;
      drumShapes[2].y = cy - spreadY * 0.65;

      drumShapes[3].x = cx + spreadX * 0.6;
      drumShapes[3].y = cy - spreadY * 0.65;
    }

    window.addEventListener('resize', layoutElements);
    layoutElements();

    // --- RECORDING TO SHEET MUSIC ---
    function addSheetNote(label, step, color, isDrum = false) {
      sheetNotes.push({
        label,
        step,
        color,
        isDrum,
        x: width - 70,
        alpha: 1,
        born: performance.now()
      });
      if (sheetNotes.length > 60) {
        sheetNotes.shift();
      }
    }

    function triggerString(s, velocity = 22) {
      s.amp = velocity;
      playGuitarNote(s.freq);
      addSheetNote(s.name, s.step, s.color, false);
    }

    function triggerDrum(d) {
      d.pulse = 1.0;
      playDrum(d.id);
      addSheetNote(d.label, d.step, d.color, true);
    }

    // --- KINETIC ORBS ---
    function spawnOrb(x, y) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 3.2 + Math.random() * 2.2;
      orbs.push({
        x: x ?? width * 0.45,
        y: y ?? (staffTop * 0.45),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 9,
        cooldowns: new Map()
      });
    }

    // Spawn 2 initial kinetic orbs so the app feels alive immediately
    spawnOrb(width * 0.3, staffTop * 0.35);
    spawnOrb(width * 0.75, staffTop * 0.35);

    // --- POINTER / MOUSE INTERACTION ---
    let pointer = { active: false, x: 0, y: 0, px: 0, py: 0 };

    function checkLineCross(x1, y1, x2, y2, sx1, sx2, sy) {
      if (Math.max(x1, x2) < sx1 || Math.min(x1, x2) > sx2) return false;
      return (y1 < sy && y2 >= sy) || (y1 > sy && y2 <= sy);
    }

    canvas.addEventListener('pointerdown', (e) => {
      ensureAudio();
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      pointer.active = true;
      pointer.x = pointer.px = x;
      pointer.y = pointer.py = y;

      // Check direct click on drum shapes
      drumShapes.forEach(d => {
        const dist = Math.hypot(x - d.x, y - d.y);
        if (dist <= d.r + 6) {
          triggerDrum(d);
        }
      });

      // Check direct click near guitar string
      guitarStrings.forEach(s => {
        if (x >= s.x1 && x <= s.x2 && Math.abs(y - s.y) < 10) {
          triggerString(s, 20);
        }
      });
    });

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      pointer.px = pointer.x;
      pointer.py = pointer.y;
      pointer.x = x;
      pointer.y = y;

      // Allow effortless hover/drag strumming and shape swiping
      guitarStrings.forEach(s => {
        if (checkLineCross(pointer.px, pointer.py, pointer.x, pointer.y, s.x1, s.x2, s.y)) {
          const dy = Math.min(32, Math.max(12, Math.abs(pointer.y - pointer.py) * 1.4));
          triggerString(s, pointer.y > pointer.py ? dy : -dy);
        }
      });

      drumShapes.forEach(d => {
        const prevDist = Math.hypot(pointer.px - d.x, pointer.py - d.y);
        const currDist = Math.hypot(pointer.x - d.x, pointer.y - d.y);
        if (prevDist > d.r && currDist <= d.r) {
          triggerDrum(d);
        }
      });
    });

    window.addEventListener('pointerup', () => {
      pointer.active = false;
    });

    canvas.addEventListener('dblclick', (e) => {
      if (e.clientY < staffTop - 20) {
        spawnOrb(e.clientX, e.clientY);
      }
    });

    document.getElementById('addOrbBtn').addEventListener('click', () => {
      ensureAudio();
      spawnOrb(width * (0.25 + Math.random() * 0.5), 120 + Math.random() * (staffTop - 200));
    });

    document.getElementById('clearOrbsBtn').addEventListener('click', () => {
      orbs.length = 0;
    });

    document.getElementById('clearScoreBtn').addEventListener('click', () => {
      sheetNotes.length = 0;
    });

    // --- DRAWING HELPERS ---
    function drawPolygon(ctx, x, y, radius, sides, rotation = 0) {
      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const a = rotation + (i * 2 * Math.PI) / sides;
        const px = x + Math.cos(a) * radius;
        const py = y + Math.sin(a) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    // --- MAIN ANIMATION LOOP ---
    function animate(now) {
      ctx.clearRect(0, 0, width, height);

      // 1. Update & Draw Guitar Strings
      guitarStrings.forEach((s) => {
        // Spring physics for string vibration
        const force = -0.35 * s.amp;
        s.vel = (s.vel + force) * 0.90;
        s.amp += s.vel;
        if (Math.abs(s.amp) < 0.05) s.amp = 0;

        // Glow when vibrating
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y);
        ctx.quadraticCurveTo((s.x1 + s.x2) / 2, s.y + s.amp, s.x2, s.y);
        ctx.strokeStyle = Math.abs(s.amp) > 1 ? s.color : 'rgba(226, 232, 240, 0.35)';
        ctx.lineWidth = Math.abs(s.amp) > 1 ? 3 : 1.6;
        if (Math.abs(s.amp) > 1) {
          ctx.shadowColor = s.color;
          ctx.shadowBlur = 14;
        }
        ctx.stroke();

        // String End Pins & Note Label
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x1, s.y, 4, 0, Math.PI * 2);
        ctx.arc(s.x2, s.y, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(226, 232, 240, 0.5)';
        ctx.font = '12px monospace';
        ctx.fillText(s.name, s.x1 - 28, s.y + 4);
        ctx.restore();
      });

      // 2. Update & Draw Drum Shapes
      drumShapes.forEach((d) => {
        d.pulse *= 0.88;
        const r = d.r + d.pulse * 12;

        ctx.save();
        ctx.strokeStyle = d.color;
        ctx.lineWidth = 2.5 + d.pulse * 3;
        ctx.fillStyle = `rgba(255, 255, 255, ${0.03 + d.pulse * 0.18})`;
        if (d.pulse > 0.05) {
          ctx.shadowColor = d.color;
          ctx.shadowBlur = 22 * d.pulse;
        }

        if (d.shape === 'circle') {
          ctx.beginPath();
          ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
        } else if (d.shape === 'square') {
          drawPolygon(ctx, d.x, d.y, r, 4, Math.PI / 4);
        } else if (d.shape === 'hexagon') {
          drawPolygon(ctx, d.x, d.y, r, 6, 0);
        } else if (d.shape === 'triangle') {
          drawPolygon(ctx, d.x, d.y, r, 3, -Math.PI / 2);
        }
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = 'rgba(226, 232, 240, 0.75)';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(d.label, d.x, d.y + 4);
        ctx.restore();
      });

      // 3. Update & Draw Kinetic Orbs
      orbs.forEach((orb) => {
        const px = orb.x;
        const py = orb.y;
        orb.x += orb.vx;
        orb.y += orb.vy;

        // Bounce off walls and top of sheet music panel
        if (orb.x < orb.r || orb.x > width - orb.r) orb.vx *= -1;
        if (orb.y < 60 + orb.r || orb.y > staffTop - 24 - orb.r) orb.vy *= -1;

        // Check orb crossing guitar strings
        guitarStrings.forEach((s, idx) => {
          const key = `str_${idx}`;
          const lastHit = orb.cooldowns.get(key) || 0;
          if (now - lastHit > 160 && checkLineCross(px, py, orb.x, orb.y, s.x1, s.x2, s.y)) {
            triggerString(s, orb.vy > 0 ? 22 : -22);
            orb.cooldowns.set(key, now);
          }
        });

        // Check orb passing through/past drum shapes
        drumShapes.forEach((d) => {
          const key = `drum_${d.id}`;
          const lastHit = orb.cooldowns.get(key) || 0;
          const dist = Math.hypot(orb.x - d.x, orb.y - d.y);
          if (now - lastHit > 240 && dist < d.r + orb.r) {
            triggerDrum(d);
            orb.cooldowns.set(key, now);
            // Gentle deflection for organic motion
            const nx = (orb.x - d.x) / (dist || 1);
            const ny = (orb.y - d.y) / (dist || 1);
            const dot = orb.vx * nx + orb.vy * ny;
            if (dot < 0) {
              orb.vx -= 1.8 * dot * nx;
              orb.vy -= 1.8 * dot * ny;
            }
          }
        });

        // Render Orb
        ctx.save();
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
        ctx.fillStyle = '#f8fafc';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 12;
        ctx.fill();
        ctx.restore();
      });

      // 4. Draw Live Sheet Music Staff at Bottom
      const panelHeight = height - staffTop;
      ctx.fillStyle = 'rgba(20, 24, 33, 0.92)';
      ctx.fillRect(0, staffTop, width, panelHeight);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, staffTop);
      ctx.lineTo(width, staffTop);
      ctx.stroke();

      // 5 Staff Lines
      const lineSpacing = 13;
      const baseLineY = staffTop + panelHeight * 0.52; // Bottom line E4 (step 0)

      ctx.strokeStyle = 'rgba(226, 232, 240, 0.22)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        const ly = baseLineY - i * lineSpacing;
        ctx.beginPath();
        ctx.moveTo(40, ly);
        ctx.lineTo(width - 40, ly);
        ctx.stroke();
      }

      // Treble Clef Symbol
      ctx.fillStyle = 'rgba(226, 232, 240, 0.55)';
      ctx.font = '56px serif';
      ctx.fillText('𝄞', 48, baseLineY - lineSpacing * 0.7);

      // Update & Render Scrolling Sheet Notes
      const stepHalf = lineSpacing / 2;
      for (let i = sheetNotes.length - 1; i >= 0; i--) {
        const n = sheetNotes[i];
        n.x -= 1.65; // Scroll left smoothly

        const ny = baseLineY - n.step * stepHalf;

        ctx.save();
        ctx.strokeStyle = n.color;
        ctx.fillStyle = n.color;

        // Draw ledger lines for low guitar strings
        if (n.step <= -2) {
          ctx.strokeStyle = 'rgba(226, 232, 240, 0.35)';
          ctx.lineWidth = 1;
          for (let s = -2; s >= n.step; s -= 2) {
            const lly = baseLineY - s * stepHalf;
            ctx.beginPath();
            ctx.moveTo(n.x - 10, lly);
            ctx.lineTo(n.x + 10, lly);
            ctx.stroke();
          }
          ctx.strokeStyle = n.color;
        }

        // Note head (Oval for guitar pitch, X/Diamond for percussion)
        if (n.isDrum) {
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(n.x - 5, ny - 5);
          ctx.lineTo(n.x + 5, ny + 5);
          ctx.moveTo(n.x + 5, ny - 5);
          ctx.lineTo(n.x - 5, ny + 5);
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.ellipse(n.x, ny, 6.5, 4.8, -0.35, 0, Math.PI * 2);
          ctx.fill();
        }

        // Note Stem
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        if (n.step < 4) {
          ctx.moveTo(n.x + 5.5, ny);
          ctx.lineTo(n.x + 5.5, ny - 28);
        } else {
          ctx.moveTo(n.x - 5.5, ny);
          ctx.lineTo(n.x - 5.5, ny + 28);
        }
        ctx.stroke();

        // Subtle note label underneath
        ctx.font = '10px monospace';
        ctx.fillStyle = 'rgba(226, 232, 240, 0.65)';
        ctx.textAlign = 'center';
        ctx.fillText(n.label, n.x, staffTop + panelHeight - 14);
        ctx.restore();

        if (n.x < 95) {
          sheetNotes.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
